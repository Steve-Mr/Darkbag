apply plugin: 'com.android.application'
apply plugin: 'kotlin-parcelize'
apply plugin: 'androidx.navigation.safeargs.kotlin'

def resolveGitShortSha(String pathSpec, String fallbackValue = "unknown") {
    try {
        def output = providers.exec {
            workingDir = rootDir
            commandLine('git', 'log', '-1', '--format=%h', '--', pathSpec)
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        return output ? output : fallbackValue
    } catch (Exception ignored) {
        return fallbackValue
    }
}

def hdrPlusGitShortSha = resolveGitShortSha('app/src/main/cpp/hdr-plus', 'embedded')

def shanghaiNow = java.time.ZonedDateTime.now(java.time.ZoneId.of("Asia/Shanghai"))
def defaultVersionName = shanghaiNow.format(java.time.format.DateTimeFormatter.ofPattern("yyyy.MM.dd"))
def defaultVersionCode = shanghaiNow.format(java.time.format.DateTimeFormatter.ofPattern("yyyyMMdd")) + "01"
def resolvedVersionName = providers.gradleProperty("appVersionName").orNull ?: defaultVersionName
def resolvedVersionCode = (providers.gradleProperty("appVersionCode").orNull ?: defaultVersionCode).toInteger()

android {
    namespace = 'top.maary.darkbag'
    compileSdk = 37
    defaultConfig {
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        applicationId = "top.maary.darkbag"
        minSdk = 26
        targetSdk = 35
        versionCode = resolvedVersionCode
        versionName = resolvedVersionName
        buildConfigField("String", "HDRPLUS_GIT_SHA_SHORT", "\"${hdrPlusGitShortSha}\"")

        ndk {
            abiFilters += "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments += "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    compileOptions {
        sourceCompatibility = rootProject.ext.java_version
        targetCompatibility = rootProject.ext.java_version
    }

    signingConfigs {
        release
    }

    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreFile = rootProject.file("keystore.jks")
    if (keystorePropertiesFile.exists() && keystoreFile.exists()) {
        def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        signingConfigs.release.storeFile = keystoreFile
        signingConfigs.release.storePassword = keystoreProperties['storePassword']
        signingConfigs.release.keyAlias = keystoreProperties['keyAlias']
        signingConfigs.release.keyPassword = keystoreProperties['keyPassword']
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists() && keystoreFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug {
            if (keystorePropertiesFile.exists() && keystoreFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // Kotlin lang
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // App compat and UI things
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.graphics:graphics-shapes:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.11.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'

    // Concurrent library for asynchronous coroutines
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.3.0'

    // Navigation library
    def nav_version = '2.10.2'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"


    //WindowManager
    implementation 'androidx.window:window:1.5.1'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.12.0'

    // Jetpack Preference DataStore
    implementation 'androidx.datastore:datastore-preferences:1.3.0'

    // Media3 ExoPlayer for high-performance video playback
    def media3_version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3_version"

    // Glide
    implementation 'com.github.bumptech.glide:glide:5.0.10'

    // Unit testing
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'androidx.test:rules:1.7.0'
    testImplementation 'androidx.test:runner:1.7.0'
    testImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation 'org.robolectric:robolectric:4.18.1'

    // Instrumented testing
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
